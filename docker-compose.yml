
services:
  # ──────────────────────────────────────────────
  # Panel central: solo sirve la UI y su API local
  # No necesita acceso a systemd del host
  # ──────────────────────────────────────────────
  panel:
    profiles: ["panel"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luminia-panel
    restart: unless-stopped
    ports:
      - "${LUMINA_PORT:-8127}:8127"
    environment:
      - LUMINA_HOST=0.0.0.0
      - LUMINA_PORT=8127
      - LUMINA_DB=/app/data/lumina.db
      - LUMINA_TOKEN=${LUMINA_TOKEN:-}
      - LUMINA_DEBUG=${LUMINA_DEBUG:-false}
    volumes:
      - ./data:/app/data
    networks:
      - luminia_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8127/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────────
  # Agente (systemd): corre en cada server con systemd
  # Necesita acceso a systemd/journalctl del host
  # ──────────────────────────────────────────────
  agente:
    profiles: ["agente"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luminia-agente
    restart: unless-stopped
    # Para acceder a systemd del host:
    pid: "host"
    privileged: true
    # Montajes necesarios para systemctl/journalctl:
    volumes:
      - /run/systemd:/run/systemd:ro
      - /var/run/dbus:/var/run/dbus:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ./data:/app/data
    environment:
      - LUMINA_HOST=0.0.0.0
      - LUMINA_PORT=8127
      - LUMINA_DB=/app/data/lumina.db
      - LUMINA_TOKEN=${LUMINA_TOKEN:-}
      - LUMINA_DEBUG=${LUMINA_DEBUG:-false}
    networks:
      - luminia_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8127/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────────
  # Agente (OpenRC/Alpine): corre en cada server Alpine
  # NO necesita montajes de systemd — usa rc-service/rc-status del host
  # ──────────────────────────────────────────────
  agente-alpine:
    profiles: ["agente-alpine"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: python:3.12-alpine
    container_name: luminia-agente-alpine
    restart: unless-stopped
    # Para acceder a OpenRC del host:
    pid: "host"
    privileged: true
    # Solo volumen de datos; NO montar /run/systemd (no existe en OpenRC)
    volumes:
      - ./data:/app/data
    environment:
      - LUMINA_HOST=0.0.0.0
      - LUMINA_PORT=8127
      - LUMINA_DB=/app/data/lumina.db
      - LUMINA_TOKEN=${LUMINA_TOKEN:-}
      - LUMINA_DEBUG=${LUMINA_DEBUG:-false}
    networks:
      - luminia_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8127/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  luminia_net:
    driver: bridge

# ──────────────────────────────────────────────
# Variables de entorno (crea un .env al lado de este archivo)
# ──────────────────────────────────────────────
# LUMINA_TOKEN=tu-clave-secreta   # obligatorio si expones a red
# LUMINA_PORT=8127                # puerto publicado
# LUMINA_DEBUG=false              # true para logs verbosos
#
# ──────────────────────────────────────────────
# Uso rápido
# ──────────────────────────────────────────────
# Panel central (cualquier host):
#   docker compose --profile panel up -d
#
# Agente en host con systemd (Debian, Ubuntu, Arch...):
#   docker compose --profile agente up -d
#
# Agente en host con OpenRC/Alpine (Alpine Linux, Gentoo, Artix-openrc):
#   docker compose --profile agente-alpine up -d
#
# Ver init system detectado en el agente:
#   curl http://localhost:8127/api/servidor/init