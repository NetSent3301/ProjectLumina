<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectLumina</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e6e6e6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .card {
      background: #1a1d27;
      padding: 2rem;
      border-radius: 12px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    h1 { margin-top: 0; font-size: 1.6rem; }
    p { color: #aab; }
    button {
      background: #4f8cff;
      color: #fff;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover { background: #3a74e0; }
    #resultado {
      margin-top: 1.2rem;
      font-family: monospace;
      padding: 0.8rem;
      border-radius: 8px;
      background: #12141c;
      min-height: 1.5rem;
    }
    </style>
</head>
<body>
  <div class="card">
    <h1>💡 ProjectLumina</h1>
    <p>Base del proyecto. Comprueba que el backend responde:</p>
    <button onclick="probar()">Probar conexión</button>
    <div id="resultado">Esperando...</div>
  </div>

  <script>
    async function probar() {
      const res = document.getElementById("resultado");
      res.textContent = "Comprobando...";
      try {
        const r = await fetch("/api/health");
        const data = await r.json();
        res.textContent = `Backend: ${data.status} · versión ${data.version}`;
      } catch (e) {
        res.textContent = "Error: no se pudo conectar con el backend";
      }
    }
  </script>
</body>
</html>
